<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro — El Corte Perfecto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../css/main.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    
</head>
<body class="auth-body">
    <div class="auth-card" id="registro-card">
        <div style="background:var(--charcoal);border-radius:16px 16px 0 0;padding:26px 30px;color:#fff;position:relative;overflow:hidden;">
            <div style="position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(197,160,89,.2),transparent 70%);"></div>
            <div style="display:flex;align-items:center;gap:12px;">
                <span class="brand-mark"><i class="fas fa-scissors"></i></span>
                <div>
                    <div class="brand-name" style="color:#fff;">El Corte Perfecto</div>
                    <div class="brand-sub">Crea tu cuenta de cliente</div>
                </div>
            </div>
            <h1 class="font-display" style="font-size:24px;font-weight:700;margin-top:20px;color:#fff;">Unete a la tradicion</h1>
            <p style="color:#a9a69c;font-size:13.5px;">Reserva tus citas y recibe notificaciones de tu barberia.</p>
        </div>

        <form id="registro-form" novalidate style="padding:28px 30px;display:flex;flex-direction:column;gap:14px;">
            <div class="form-grid-2">
                <div class="field">
                    <label class="field-label">Identificacion <span class="req">*</span></label>
                    <input class="input" id="r-id" placeholder="Numero de identificacion">
                    <div class="field-error" id="r-id-error" style="display:none;"><i class="fas fa-circle-exclamation"></i> Requerido.</div>
                </div>
                <div class="field">
                    <label class="field-label">Telefono <span class="req">*</span></label>
                    <input class="input" id="r-tel" type="tel" placeholder="300 123 4567">
                    <div class="field-error" id="r-tel-error" style="display:none;"><i class="fas fa-circle-exclamation"></i> Requerido.</div>
                </div>
            </div>
            <div class="form-grid-2">
                <div class="field">
                    <label class="field-label">Nombre <span class="req">*</span></label>
                    <input class="input" id="r-nombre" placeholder="Carlos">
                    <div class="field-error" id="r-nombre-error" style="display:none;"><i class="fas fa-circle-exclamation"></i> Requerido.</div>
                </div>
                <div class="field">
                    <label class="field-label">Apellido <span class="req">*</span></label>
                    <input class="input" id="r-apellido" placeholder="Lopez">
                    <div class="field-error" id="r-apellido-error" style="display:none;"><i class="fas fa-circle-exclamation"></i> Requerido.</div>
                </div>
            </div>
            <div class="field">
                <label class="field-label">Correo electronico <span class="req">*</span></label>
                <input class="input" id="r-correo" type="email" placeholder="tucorreo@mail.com">
                <div class="field-error" id="r-correo-error" style="display:none;"><i class="fas fa-circle-exclamation"></i> Ingresa un correo valido.</div>
            </div>
            <div class="form-grid-2">
                <div class="field">
                    <label class="field-label">Contrasena <span class="req">*</span></label>
                    <div class="input-wrap">
                        <input class="input" id="r-pass" type="password" placeholder="Min. 8 caracteres">
                        <button type="button" class="input-toggle toggle-eye" aria-label="Mostrar contrasena"><i class="fas fa-eye"></i></button>
                    </div>
                    <div class="field-error" id="r-pass-error" style="display:none;"><i class="fas fa-circle-exclamation"></i> Minimo 8 caracteres.</div>
                </div>
                <div class="field">
                    <label class="field-label">Confirmar <span class="req">*</span></label>
                    <div class="input-wrap">
                        <input class="input" id="r-pass2" type="password" placeholder="Repite la contrasena">
                        <button type="button" class="input-toggle toggle-eye" aria-label="Mostrar contrasena"><i class="fas fa-eye"></i></button>
                    </div>
                    <div class="field-error" id="r-pass2-error" style="display:none;"><i class="fas fa-circle-exclamation"></i> Las contrasenas no coinciden.</div>
                </div>
            </div>
            <button type="submit" class="btn btn-primary btn-lg" style="width:100%;margin-top:6px;" id="registro-btn">
                <i class="fas fa-user-plus"></i> Crear cuenta
            </button>
            <p style="text-align:center;font-size:13.5px;color:var(--smoke);margin-top:4px;">
                Ya tienes cuenta?
                <a href="login.html" style="color:var(--brass-dim);font-weight:700;text-decoration:none;">Inicia sesion</a>
            </p>
        </form>
    </div>

    <script src="../js/ui.js"></script>
    <script src="../js/dateUtils.js"></script>
    <script src="../js/data.js"></script>
    <script src="../js/api.js"></script>
    <script>
        (function () {
            "use strict";
            if (window.gsap) {
                gsap.from("#registro-card", { autoAlpha: 0, y: 28, duration: 0.55, ease: "power2.out" });
            }

            document.querySelectorAll(".toggle-eye").forEach(function (t) {
                t.addEventListener("click", function () {
                    var inp = t.closest(".input-wrap").querySelector("input");
                    var ver = inp.type === "password";
                    inp.type = ver ? "text" : "password";
                    t.innerHTML = ver ? '<i class="fas fa-eye-slash"></i>' : '<i class="fas fa-eye"></i>';
                });
            });

            function mostrarError(id) {
                var er = document.getElementById(id);
                if (er) er.style.display = "flex";
            }

            var form = document.getElementById("registro-form");
            form.addEventListener("submit", async function (e) {
                e.preventDefault();

                document.querySelectorAll(".field-error").forEach(function (er) { er.style.display = "none"; });
                document.querySelectorAll(".input.is-error").forEach(function (i) { i.classList.remove("is-error"); });

                var id = document.getElementById("r-id").value.trim();
                var nombre = document.getElementById("r-nombre").value.trim();
                var apellido = document.getElementById("r-apellido").value.trim();
                var correo = document.getElementById("r-correo").value.trim();
                var telefono = document.getElementById("r-tel").value.trim();
                var p1 = document.getElementById("r-pass").value;
                var p2 = document.getElementById("r-pass2").value;

                var ok = true;
                function marcar(el, errId, cond) {
                    if (cond) {
                        el.classList.add("is-error");
                        mostrarError(errId);
                        ok = false;
                    }
                }
                marcar(document.getElementById("r-id"), "r-id-error", !id);
                marcar(document.getElementById("r-nombre"), "r-nombre-error", !nombre);
                marcar(document.getElementById("r-apellido"), "r-apellido-error", !apellido);
                marcar(document.getElementById("r-correo"), "r-correo-error", !correo || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(correo));
                marcar(document.getElementById("r-tel"), "r-tel-error", !telefono);
                marcar(document.getElementById("r-pass"), "r-pass-error", p1.length < 8);
                marcar(document.getElementById("r-pass2"), "r-pass2-error", !p2 || p2 !== p1);
                if (!ok) return;

                var usuario = (nombre + "." + apellido).toLowerCase().replace(/[^a-z0-9._-]/g, "");
                var btn = document.getElementById("registro-btn");
                btn.classList.add("btn-loading");
                btn.disabled = true;
                try {
                    await api.registrarCliente({
                        id_usuario: id,
                        nombres: nombre,
                        apellidos: apellido,
                        usuario: usuario,
                        correo: correo,
                        telefono: telefono,
                        contraseña: p1
                    });
                    UI.toast("Cuenta creada", "Registro exitoso. Ahora inicia sesion.", "success");
                    setTimeout(function () { location.href = "login.html"; }, 900);
                } catch (err) {
                    console.error("Error en registro:", err);
                    var msg = (Array.isArray(err && err.detail) ? "Revise los datos enviados." : (err && err.message)) || "No se pudo completar el registro.";
                    UI.toast("Error", msg, "error");
                } finally {
                    btn.classList.remove("btn-loading");
                    btn.disabled = false;
                }
            });
        })();
    </script>
</body>
</html>
